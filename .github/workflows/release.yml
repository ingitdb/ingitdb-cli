name: Release

# Continuous delivery: every merge to `main` runs the shared strongo/cicd
# release workflow, which bumps the version from conventional commits and
# releases it — all in one run (the release uses the tag it just cut, so there
# is no GITHUB_TOKEN cross-workflow trigger problem). Pushing an explicit
# `vX.Y.Z` tag also works and releases that exact version (the shared workflow
# skips the bump on a tag ref). A docs/chore-only merge cuts no tag and
# publishes nothing.
#
# ingitdb is pre-1.0: allow_major_version_bump stays false, so a stray `feat!:`
# is CAPPED to a minor bump (v0.64.2 -> v0.65.0) instead of jumping to v1 — the
# guard added in strongo/cicd. Cut v1.0.0 deliberately by pushing that tag.
#
# Job graph:
#   core       — strongo/cicd shared workflow: builds every OS + archives +
#                GitHub release + AUR + Homebrew + Scoop + WinGet (one ubuntu job).
#   chocolatey — Windows-only (needs `choco`); pushes the .nupkg.
#   snap       — needs `snapcraft`; isolated so a Snap Store issue can't fail the
#                GitHub release or the other publishers.
#
# The core job's GoReleaser uploads the release (all binaries, incl. the
# unsigned macOS ones) BEFORE running its publishers, so a publisher failure
# never blocks the binaries from shipping — which is why the old dedicated
# build-macos job is no longer needed. chocolatey/snap run only when core
# actually cut a tag this run (needs.core.outputs.tag), so a no-op merge does
# not try to publish an untagged commit.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# One release at a time; a second push queues instead of racing the first.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Build every OS + publish everything that runs safely on one ubuntu job.
  core:
    name: Build + release (AUR, Homebrew, Scoop, WinGet)
    # Pinned to an immutable tag rather than the floating `v1` of strongo/cicd,
    # so this notarization pilot tests ONE variable at a time instead of
    # silently picking up unrelated release-machinery changes. Bumped
    # 2026-08-28 from v1.14.5 to v1.14.9 (same commit fd908b7c as v1 at time
    # of bump) to pick up the fix that makes verification use
    # `spctl -a -vv -t install` and assert `source=Notarized Developer ID`.
    uses: strongo/cicd/.github/workflows/release.yml@v1.18.0
    permissions:
      contents: write
      # Lets the require_workflow_success guard read the quality
      # workflow's result for this commit. A reusable workflow cannot
      # grant itself more than its caller allows, so it belongs here.
      actions: read
    with:
      # Refuse to tag or publish unless this repo's quality workflow
      # passed for this exact commit. Release and that workflow are
      # siblings started by the same push, with no cross-workflow
      # `needs:` between them, so before this a red suite could not
      # stop a release. datatug-cli shipped v0.13.2 that way. Names
      # the workflow's `name:`, not its filename.
      require_workflow_success: 'CI (build, lint, test, bump)'
      # Must be >= go.mod's `go` directive. The shared release job runs its
      # `go mod tidy` before-hook under this setup-go version with
      # GOTOOLCHAIN=local, so a lower value fails with
      # "go.mod requires go >= 1.27.0" before the build ever starts.
      go_version: '1.27.0'
      # Pre-1.0: cap an accidental major (feat!:) to a minor bump. Cut v1.0.0
      # only by pushing that tag explicitly.
      allow_major_version_bump: false
      # Block publication unless the macOS build is genuinely signed, notarized,
      # AND executable. Without this the preflight gate never runs: specscore-cli
      # v0.37.10 shipped a binary macOS SIGKILLs, with a green release.
      # See https://github.com/strongo/cicd/issues/66
      require_notarized_macos: true
    secrets:
      # Cross-repo PAT for the Homebrew tap + Scoop bucket (the default
      # GITHUB_TOKEN can't push to those repos).
      GORELEASER_GITHUB_TOKEN: ${{ secrets.INGITDB_GORELEASER_GITHUB_TOKEN }}
      # Separate classic PAT for the WinGet cross-fork PR to microsoft/winget-pkgs.
      WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
      # AUR SSH deploy key (key contents; GoReleaser accepts them directly).
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      # macOS signing + notarization. These activate the `notarize:` block in
      # .goreleaser.yaml, which is gated on MACOS_SIGN_P12 being set and has been
      # dormant purely because the shared workflow did not forward these through.
      # Unsigned darwin binaries are blocked by Gatekeeper when installed via the
      # Homebrew cask ("Apple could not verify ... is free of malware"), because
      # they are ad-hoc signed with no Team Identifier.
      MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
      MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
      NOTARIZE_ISSUER_ID: ${{ secrets.NOTARIZE_ISSUER_ID }}
      NOTARIZE_KEY_ID: ${{ secrets.NOTARIZE_KEY_ID }}
      NOTARIZE_KEY: ${{ secrets.NOTARIZE_KEY }}

  # Chocolatey needs the `choco` CLI, which exists only on Windows runners, so
  # it cannot converge into the shared ubuntu job. It packages the same Windows
  # zip the core job uploaded and pushes the .nupkg to chocolatey.org.
  chocolatey:
    name: Publish Chocolatey (Windows)
    needs: core
    if: ${{ !failure() && !cancelled() && (needs.core.outputs.tag != '' || github.ref_type == 'tag') }}
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Enable Git long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2
          args: release --clean --config .github/goreleaser-chocolatey.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.INGITDB_GORELEASER_GITHUB_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

  # Snapcraft needs `snapcraft` installed and is kept isolated so a Snap Store
  # outage / review hold fails only this job.
  snap:
    name: Publish Snapcraft
    needs: core
    if: ${{ !failure() && !cancelled() && (needs.core.outputs.tag != '' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Install snapcraft
        run: sudo snap install snapcraft --classic

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2
          args: release --clean --config .github/goreleaser-snap.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.INGITDB_GORELEASER_GITHUB_TOKEN }}
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}