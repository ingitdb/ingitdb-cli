name: Pull request title

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-latest
    steps:
      - name: Require a conventional pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail

          pattern='^(feat|fix|perf|refactor|docs|ci|chore|test|build|revert)(\([a-z0-9][a-z0-9._/-]*\))?(!)?: .+[^[:space:]]$'
          if [[ ! "$PR_TITLE" =~ $pattern ]]; then
            echo "Pull request title must use Conventional Commits syntax." >&2
            echo "Example: fix(cli): distinguish validation failure exits" >&2
            exit 1
          fi
